<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endereçamento IP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Aviso que fica ATRÁS da apresentação: só aparece se o Gamma não carregar */
    #aviso {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #333;
      text-align: center;
      padding: 16px;
    }
    #aviso a { color: #4b3fd8; font-weight: 600; }
    #apresentacao {
      position: fixed;
      inset: 0;
      width: 100% !important;
      max-width: 100%;
      height: 100% !important;
      border: none;
      z-index: 1;
      background: transparent;
    }
    #btn-tela-cheia {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.3s, background 0.2s;
    }
    #btn-tela-cheia:hover { background: rgba(0, 0, 0, 0.85); }
    #btn-voltar {
      position: fixed;
      right: 150px;
      bottom: 16px;
      z-index: 10;
      padding: 10px 16px;
      border-radius: 8px;
      background: #d32f2f;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.3s, background 0.2s;
    }
    #btn-voltar:hover { background: #b71c1c; }
    body.cheia #btn-tela-cheia, body.cheia #btn-voltar { opacity: 0; }
    body.cheia #btn-tela-cheia:hover, body.cheia #btn-voltar:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="aviso">
    <p>Carregando a apresentação…</p>
    <p>Se ela não aparecer, <a href="https://gamma.app/docs/7za3z955toqgtj9" target="_blank" rel="noopener">abra diretamente no Gamma</a>.</p>
  </div>

  <!-- Código de incorporação original do Gamma, ajustado para ocupar a tela inteira -->
  <iframe
    id="apresentacao"
    src="https://gamma.app/embed/7za3z955toqgtj9"
    style="width: 700px; max-width: 100%; height: 450px"
    allow="fullscreen"
    allowfullscreen
    title="Endereçamento IP"></iframe>

  <a id="btn-voltar" href="https://alberto-barros.github.io/Redes/">← Voltar</a>
  <button id="btn-tela-cheia" type="button">⛶ Tela cheia</button>

  <script>
    const btn = document.getElementById('btn-tela-cheia');
    const raiz = document.documentElement;

    function alternarTelaCheia() {
      if (!document.fullscreenElement) {
        (raiz.requestFullscreen || raiz.webkitRequestFullscreen).call(raiz);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    }

    btn.addEventListener('click', alternarTelaCheia);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') alternarTelaCheia();
    });
    document.addEventListener('fullscreenchange', () => {
      const ativo = !!document.fullscreenElement;
      document.body.classList.toggle('cheia', ativo);
      btn.textContent = ativo ? '✕ Sair da tela cheia' : '⛶ Tela cheia';
    });
  </script>
</body>
</html>
